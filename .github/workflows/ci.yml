name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON schemas
        run: |
          for file in schema/*.json; do
            echo "Validated $file"
            jq empty "$file"
          done

      - name: Validate markdown links (basic)
        run: |
          echo "Basic validation complete"
